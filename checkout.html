<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Aab</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Poppins', sans-serif;
        }

        body {
            background-color: #0b0b0b;
            color: #ffffff;
            overflow-x: hidden;
            position: relative;
        }

        /* Animated Background Circles */
        .bg-animations {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            z-index: -1;
        }

        .circle {
            position: absolute;
            border-radius: 50%;
            background: rgba(255, 30, 56, 0.15);
            animation: floatCircle 12s infinite linear;
        }

        .circle:nth-child(1) {
            width: 280px;
            height: 280px;
            top: -60px;
            left: -60px;
            animation-duration: 10s;
        }

        .circle:nth-child(2) {
            width: 350px;
            height: 350px;
            bottom: -100px;
            right: -100px;
            animation-duration: 14s;
            background: rgba(255, 30, 56, 0.1);
        }

        .circle:nth-child(3) {
            width: 180px;
            height: 180px;
            top: 45%;
            left: 75%;
            animation-duration: 9s;
        }

        @keyframes floatCircle {
            0% {
                transform: translateY(0) scale(1);
            }
            50% {
                transform: translateY(-35px) scale(1.06);
            }
            100% {
                transform: translateY(0) scale(1);
            }
        }

        /* Navbar */
        nav {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 15px 5%;
            background: rgba(18, 18, 18, 0.85);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .logo {
            font-size: 26px;
            font-weight: 700;
            color: #ffffff;
            letter-spacing: 1px;
        }

        .logo span {
            color: #ff1e38;
        }

        .nav-icons {
            display: flex;
            gap: 15px;
        }

        .icon-btn {
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 12px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 16px;
        }

        /* Header Banner Section */
        .header-section {
            padding: 40px 5%;
            background: linear-gradient(135deg, rgba(20, 20, 20, 0.9), rgba(11, 11, 11, 0.9));
            border-bottom: 1px solid rgba(255, 255, 255, 0.05);
        }

        .header-section h1 {
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 5px;
            color: #fff;
        }

        .breadcrumb {
            font-size: 14px;
            color: #aaa;
        }

        .breadcrumb span {
            color: #ff1e38;
        }

        /* Main Form Container */
        .container {
            max-width: 550px;
            margin: 30px auto;
            padding: 0 20px 50px 20px;
        }

        .card {
            background: #141414;
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
        }

        .card h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            color: #fff;
        }

        .card p {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 25px;
            line-height: 1.5;
        }

        /* Form Controls */
        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            font-size: 13px;
            font-weight: 500;
            margin-bottom: 8px;
            color: #ddd;
        }

        .form-control {
            width: 100%;
            padding: 12px 15px;
            background: #1a1a1a;
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 8px;
            color: #fff;
            font-size: 14px;
            outline: none;
            transition: all 0.3s ease;
        }

        .form-control:focus {
            border-color: #ff1e38;
            box-shadow: 0 0 8px rgba(255, 30, 56, 0.3);
        }

        .package-box {
            background: #1a1a1a;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            color: #aaa;
            font-size: 14px;
        }

        /* Checkbox */
        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
            margin: 25px 0;
            font-size: 13px;
            color: #aaa;
        }

        .checkbox-group input {
            accent-color: #ff1e38;
            width: 16px;
            height: 16px;
            cursor: pointer;
        }

        .checkbox-group a {
            color: #ff1e38;
            text-decoration: none;
        }

        .checkbox-group a:hover {
            text-decoration: underline;
        }

        /* Payment Option */
        .payment-option {
            display: flex;
            align-items: center;
            gap: 10px;
            background: #1a1a1a;
            padding: 12px 15px;
            border-radius: 8px;
            border: 1px solid rgba(255, 255, 255, 0.1);
            margin-bottom: 25px;
            font-size: 14px;
            cursor: pointer;
        }

        .payment-option input {
            accent-color: #ff1e38;
        }

        /* Submit Button */
        .btn-register {
            width: 100%;
            padding: 14px;
            background: #ff1e38;
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 30, 56, 0.4);
        }

        .btn-register:hover {
            background: #e0162f;
            box-shadow: 0 6px 20px rgba(255, 30, 56, 0.6);
            transform: translateY(-2px);
        }

        /* Footer Links inside card */
        .footer-text {
            text-align: center;
            margin-top: 20px;
            font-size: 13px;
            color: #888;
        }

        .footer-text a {
            color: #ff1e38;
            text-decoration: none;
            font-weight: 500;
        }

        .footer-text a:hover {
            text-decoration: underline;
        }
    </style>
</head>
<body>

    <!-- Animated Background Circles -->
    <div class="bg-animations">
        <div class="circle"></div>
        <div class="circle"></div>
        <div class="circle"></div>
    </div>

    <!-- Navigation -->
    <nav>
        <div class="logo">Aab<span>.</span></div>
        <div class="nav-icons">
            <button class="icon-btn">👤</button>
            <button class="icon-btn">📦</button>
        </div>
    </nav>

    <!-- Header Banner -->
    <div class="header-section">
        <h1>Checkout</h1>
        <div class="breadcrumb">Home &gt; <span>Checkout</span></div>
    </div>

    <!-- Checkout Form Container -->
    <div class="container">
        <div class="card">
            <h2>Register Account</h2>
            <p>Welcome to Aab! Ready to start? Enter your details below to get started instantly.</p>

            <form>
                <div class="form-group">
                    <label>Referral Code</label>
                    <input type="text" class="form-control" placeholder="Referral Code">
                </div>

                <div class="form-group">
                    <label>Package</label>
                    <div class="package-box">Aab Premium Package - ₹2399</div>
                </div>

                <div class="form-group">
                    <label>Name</label>
                    <input type="text" class="form-control" placeholder="Full Name">
                </div>

                <div class="form-group">
                    <label>Phone</label>
                    <input type="tel" class="form-control" placeholder="Phone Number">
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" class="form-control" placeholder="Email Address">
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" class="form-control" placeholder="Password">
                </div>

                <div class="checkbox-group">
                    <input type="checkbox" id="terms">
                    <label for="terms" style="margin-bottom:0; color:#aaa;">I agree to the <a href="#">Privacy Policy</a> and <a href="#">Terms & Conditions</a></label>
                </div>

                <div class="form-group">
                    <label>Select Payment Method</label>
                    <div class="payment-option">
                        <input type="radio" checked id="pay">
                        <label for="pay" style="margin-bottom:0; cursor:pointer;">Pay via UPI, Card, Netbanking...</label>
                    </div>
                </div>

                <button type="submit" class="btn-register">Register &rarr;</button>

                <div class="footer-text">
                    Already have an account? <a href="#">Sign In</a>
                </div>
            </form>
        </div>
    </div>

</body>
</html>
