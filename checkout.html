<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - SkillsMarket</title>
    <style>
        body {
            background-color: #0d0d0d;
            color: #fff;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .checkout-header {
            background: #141414;
            padding: 15px 20px;
            border-bottom: 1px solid #222;
        }
        .checkout-header h1 {
            color: #ff3b3b;
            margin: 0;
            font-size: 22px;
        }
        .breadcrumb {
            color: #888;
            font-size: 14px;
            margin-top: 5px;
        }
        .breadcrumb span {
            color: #ff3b3b;
        }
        .checkout-container {
            max-width: 600px;
            margin: 30px auto;
            background: #141414;
            border: 1px solid rgba(255, 59, 59, 0.3);
            border-radius: 16px;
            padding: 25px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
        }
        h2 {
            color: #fff;
            font-size: 20px;
            margin-bottom: 20px;
            border-bottom: 1px solid #222;
            padding-bottom: 10px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 6px;
            color: #ccc;
            font-size: 14px;
        }
        input, select {
            width: 100%;
            padding: 12px;
            background: #1f1f1f;
            border: 1px solid #333;
            border-radius: 8px;
            color: #fff;
            font-size: 15px;
            box-sizing: border-box;
        }
        input:focus, select:focus {
            border-color: #ff3b3b;
            outline: none;
        }
        .order-box {
            background: #1a0505;
            border: 1px solid #ff3b3b;
            border-radius: 10px;
            padding: 15px;
            margin-top: 25px;
        }
        .order-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 15px;
        }
        .order-row.total {
            font-weight: bold;
            color: #ff3b3b;
            font-size: 18px;
            border-top: 1px solid #333;
            padding-top: 10px;
            margin-top: 10px;
        }
        .terms {
            margin: 20px 0;
            display: flex;
            align-items: center;
            font-size: 14px;
            color: #aaa;
        }
        .terms input {
            width: auto;
            margin-right: 10px;
        }
        .terms a {
            color: #ff3b3b;
            text-decoration: none;
        }
        .btn-next {
            width: 100%;
            background: linear-gradient(135deg, #ff3b3b, #b30000);
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: opacity 0.3s;
        }
        .btn-next:hover {
            opacity: 0.9;
        }
        footer {
            background: #111;
            color: #777;
            text-align: center;
            padding: 20px;
            margin-top: 40px;
            font-size: 14px;
            border-top: 1px solid #222;
        }
    </style>
</head>
<body>

    <div class="checkout-header">
        <h1>Checkout</h1>
        <div class="breadcrumb">Home // <span>Checkout</span></div>
    </div>

    <div class="checkout-container">
        <form action="#" method="POST">
            
            <h2>Billing Details</h2>

            <div class="form-group">
                <label>Your Affiliate Code *</label>
                <input type="text" placeholder="Referral Code (Optional)">
            </div>

            <div class="form-group">
                <label>Name *</label>
                <input type="text" placeholder="Enter Your Name..." required>
            </div>

            <div class="form-group">
                <label>Enter State *</label>
                <select required>
                    <option value="">Select State</option>
                    <option value="Madhya Pradesh">Madhya Pradesh</option>
                    <option value="Delhi">Delhi</option>
                    <option value="Maharashtra">Maharashtra</option>
                    <option value="Uttar Pradesh">Uttar Pradesh</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Enter Mobile Number *</label>
                <input type="tel" placeholder="+91 | Enter mobile number" required>
            </div>

            <div class="form-group">
                <label>Email Id *</label>
                <input type="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label>Password *</label>
                <input type="password" placeholder="Password" required>
            </div>

            <div class="form-group">
                <label>Confirm Password *</label>
                <input type="password" placeholder="Confirm Password" required>
            </div>

            <div class="order-box">
                <h3 style="color:#fff; margin-top:0; font-size:16px;">Your Order</h3>
                <div class="order-row">
                    <span>Product</span>
                    <span>Total</span>
                </div>
                <div class="order-row">
                    <span>Skill Growth Package:</span>
                    <span>₹749</span>
                </div>
                <div class="order-row total">
                    <span>Grand Total:</span>
                    <span>₹749</span>
                </div>
            </div>

            <div class="terms">
                <input type="checkbox" id="terms" required>
                <label for="terms" style="margin:0; color:#aaa;">I agree to the <a href="#">Terms of Service</a> and <a href="#">Privacy Policy</a>.</label>
            </div>

            <button type="submit" class="btn-next">Next &gt;&gt;</button>

        </form>
    </div>

    <footer>
        <p>&copy; 2026 SkillsMarket. All Rights Reserved.</p>
    </footer>

</body>
</html>
