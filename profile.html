<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Skills Market</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
            font-family:Arial, sans-serif;
        }

        body{
            background:#f5f7fb;
            color:#111827;
            min-height:100vh;
        }

        .navbar{
            height:70px;
            background:#111827;
            color:white;
            display:flex;
            align-items:center;
            justify-content:space-between;
            padding:0 30px;
        }

        .logo{
            font-size:24px;
            font-weight:700;
        }

        .back-btn{
            text-decoration:none;
            color:white;
            background:#4f46e5;
            padding:10px 18px;
            border-radius:8px;
            font-size:14px;
        }

        .container{
            max-width:1100px;
            margin:35px auto;
            padding:0 20px;
        }

        .page-title{
            margin-bottom:25px;
        }

        .page-title h1{
            font-size:30px;
            margin-bottom:7px;
        }

        .page-title p{
            color:#6b7280;
        }

        .profile-card{
            background:white;
            border-radius:16px;
            padding:30px;
            box-shadow:0 8px 30px rgba(0,0,0,.07);
        }

        .profile-header{
            display:flex;
            align-items:center;
            gap:20px;
            padding-bottom:25px;
            border-bottom:1px solid #e5e7eb;
            margin-bottom:25px;
        }

        .avatar{
            width:80px;
            height:80px;
            border-radius:50%;
            background:#4f46e5;
            color:white;
            display:flex;
            align-items:center;
            justify-content:center;
            font-size:30px;
            font-weight:bold;
        }

        .profile-header h2{
            font-size:24px;
            margin-bottom:7px;
        }

        .member-id{
            color:#6b7280;
            font-size:14px;
        }

        .status{
            display:inline-block;
            margin-top:8px;
            padding:5px 12px;
            border-radius:20px;
            background:#dcfce7;
            color:#166534;
            font-size:12px;
            font-weight:bold;
        }

        .details{
            display:grid;
            grid-template-columns:repeat(2,1fr);
            gap:20px;
        }

        .detail-box{
            border:1px solid #e5e7eb;
            border-radius:12px;
            padding:18px;
            background:#fafafa;
        }

        .detail-box label{
            display:block;
            color:#6b7280;
            font-size:13px;
            margin-bottom:8px;
        }

        .detail-box span{
            font-size:16px;
            font-weight:600;
            word-break:break-word;
        }

        .loading{
            text-align:center;
            padding:40px;
            color:#6b7280;
        }

        .error{
            background:#fee2e2;
            color:#991b1b;
            padding:15px;
            border-radius:10px;
            margin-bottom:20px;
            display:none;
        }

        @media(max-width:700px){

            .navbar{
                padding:0 15px;
            }

            .logo{
                font-size:20px;
            }

            .back-btn{
                padding:8px 12px;
            }

            .container{
                margin:25px auto;
                padding:0 15px;
            }

            .page-title h1{
                font-size:25px;
            }

            .profile-card{
                padding:20px;
            }

            .profile-header{
                align-items:flex-start;
            }

            .avatar{
                width:65px;
                height:65px;
                font-size:24px;
            }

            .profile-header h2{
                font-size:20px;
            }

            .details{
                grid-template-columns:1fr;
                gap:14px;
            }
        }
    </style>
</head>

<body>

    <nav class="navbar">
        <div class="logo">Skills Market</div>

        <a href="dashboard.html" class="back-btn">
            ← Dashboard
        </a>
    </nav>


    <main class="container">

        <div class="page-title">
            <h1>My Profile</h1>
            <p>View your Skills Market member information.</p>
        </div>


        <div id="errorBox" class="error"></div>


        <div class="profile-card">

            <div id="loadingBox" class="loading">
                Loading your profile...
            </div>


            <div id="profileContent" style="display:none;">

                <div class="profile-header">

                    <div class="avatar" id="avatar">
                        M
                    </div>

                    <div>
                        <h2 id="headerName">Member</h2>

                        <div class="member-id">
                            Member ID:
                            <span id="headerMemberId">Not Assigned</span>
                        </div>

                        <span class="status" id="headerStatus">
                            Active
                        </span>
                    </div>

                </div>


                <div class="details">

                    <div class="detail-box">
                        <label>Member ID</label>
                        <span id="memberId">-</span>
                    </div>

                    <div class="detail-box">
                        <label>Full Name</label>
                        <span id="fullName">-</span>
                    </div>

                    <div class="detail-box">
                        <label>Email</label>
                        <span id="email">-</span>
                    </div>

                    <div class="detail-box">
                        <label>Phone</label>
                        <span id="phone">-</span>
                    </div>

                    <div class="detail-box">
                        <label>Package</label>
                        <span id="packageName">-</span>
                    </div>

                    <div class="detail-box">
                        <label>Package Price</label>
                        <span id="packagePrice">-</span>
                    </div>

                    <div class="detail-box">
                        <label>Referral Code</label>
                        <span id="referralCode">-</span>
                    </div>

                    <div class="detail-box">
                        <label>Sponsor / Referrer</label>
                        <span id="referrerId">-</span>
                    </div>

                    <div class="detail-box">
                        <label>Account Status</label>
                        <span id="accountStatus">-</span>
                    </div>

                    <div class="detail-box">
                        <label>Joining Date</label>
                        <span id="joiningDate">-</span>
                    </div>

                </div>

            </div>

        </div>

    </main>


<script>

    /* ==============================
       SUPABASE CONNECTION
    ============================== */

    const SUPABASE_URL =
        "https://hmlonjwqeqedakzhucix.supabase.co";

    const SUPABASE_KEY =
        "YOUR_PUBLISHABLE_KEY";


    const supabaseClient =
        window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_KEY
        );


    /* ==============================
       HELPER
    ============================== */

    function setText(id, value){

        const element =
            document.getElementById(id);

        if(element){
            element.textContent =
                value ?? "-";
        }
    }


    /* ==============================
       LOAD PROFILE
    ============================== */

    async function loadProfile(){

        try{

            const {
                data:{user},
                error:authError
            } =
            await supabaseClient.auth.getUser();


            /* USER LOGIN CHECK */

            if(authError || !user){

                window.location.href =
                    "login.html";

                return;
            }


            /* GET PROFILE */

            const {
                data:profile,
                error
            } =
            await supabaseClient
                .from("profiles")
                .select("*")
                .eq("id", user.id)
                .maybeSingle();


            if(error){

                console.error(
                    "Profile error:",
                    error
                );

                showError(
                    "Profile data load nahi ho pa raha."
                );

                return;
            }


            if(!profile){

                showError(
                    "Is account ke liye profile record nahi mila."
                );

                return;
            }


            /* ==============================
               PROFILE DATA
            ============================== */

            const fullName =
                profile.full_name ||
                user.user_metadata?.full_name ||
                "Member";


            const memberId =
                profile.member_id ||
                "Not Assigned";


            const phone =
                profile.phone ||
                "Not Added";


            const packageName =
                profile.package_name ||
                "Package Not Assigned";


            const packagePrice =
                profile.package_price !== null &&
                profile.package_price !== undefined
                ? "₹" + profile.package_price
                : "Not Available";


            const referralCode =
                profile.referral_code ||
                "Not Assigned";


            const referrerId =
                profile.referrer_member_id ||
                "No Sponsor";


            const accountStatus =
                profile.account_status ||
                "Active";


            let joiningDate =
                "Not Available";


            if(profile.created_at){

                joiningDate =
                    new Date(
                        profile.created_at
                    ).toLocaleDateString(
                        "en-IN",
                        {
                            day:"2-digit",
                            month:"short",
                            year:"numeric"
                        }
                    );
            }


            /* ==============================
               PUT DATA ON SCREEN
            ============================== */

            setText(
                "memberId",
                memberId
            );

            setText(
                "fullName",
                fullName
            );

            setText(
                "email",
                user.email || "Not Available"
            );

            setText(
                "phone",
                phone
            );

            setText(
                "packageName",
                packageName
            );

            setText(
                "packagePrice",
                packagePrice
            );

            setText(
                "referralCode",
                referralCode
            );

            setText(
                "referrerId",
                referrerId
            );

            setText(
                "accountStatus",
                accountStatus
            );

            setText(
                "joiningDate",
                joiningDate
            );


            /* HEADER */

            setText(
                "headerName",
                fullName
            );

            setText(
                "headerMemberId",
                memberId
            );

            setText(
                "headerStatus",
                accountStatus
            );


            /* AVATAR */

            const firstLetter =
                fullName
                    .trim()
                    .charAt(0)
                    .toUpperCase() || "M";


            setText(
                "avatar",
                firstLetter
            );


            /* SHOW PROFILE */

            document.getElementById(
                "loadingBox"
            ).style.display = "none";


            document.getElementById(
                "profileContent"
            ).style.display = "block";

        }

        catch(error){

            console.error(
                "Dashboard profile error:",
                error
            );

            showError(
                "Something went wrong. Please try again."
            );
        }
    }


    /* ==============================
       ERROR
    ============================== */

    function showError(message){

        const errorBox =
            document.getElementById(
                "errorBox"
            );

        errorBox.textContent =
            message;

        errorBox.style.display =
            "block";

        document.getElementById(
            "loadingBox"
        ).style.display =
            "none";
    }


    /* ==============================
       START
    ============================== */

    loadProfile();

</script>

</body>
</html>
