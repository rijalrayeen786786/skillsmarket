<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bank Account Information</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: linear-gradient(135deg, #fce4ec, #f3e5f5);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .form-container {
            background: #ffffff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            width: 100%;
            max-width: 400px;
        }
        h2 {
            color: #6a1b9a;
            margin-bottom: 20px;
            font-size: 22px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            font-size: 14px;
            color: #333;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
            box-sizing: border-box;
            background-color: #fafafa;
        }
        input:focus {
            border-color: #ab47bc;
            outline: none;
            background-color: #fff;
        }
        .btn-otp {
            width: 100%;
            padding: 12px;
            background: linear-gradient(135deg, #e91e63, #9c27b0);
            border: none;
            color: white;
            font-size: 16px;
            font-weight: bold;
            border-radius: 25px;
            cursor: pointer;
            margin-top: 10px;
            transition: opacity 0.3s ease;
        }
        .btn-otp:hover {
            opacity: 0.9;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Bank Account Information</h2>
        <form>
            <div class="form-group">
                <label>Holder Name</label>
                <input type="text" placeholder="Apna Naam ya Company Name daalein">
            </div>
            <div class="form-group">
                <label>IFSC Code</label>
                <input type="text" placeholder="IFSC Code daalein">
            </div>
            <div class="form-group">
                <label>Account Number</label>
                <input type="text" placeholder="Account Number daalein">
            </div>
            <div class="form-group">
                <label>Bank Name</label>
                <input type="text" placeholder="Bank ka Naam daalein">
            </div>
            <div class="form-group">
                <label>UPI ID</label>
                <input type="text" placeholder="UPI ID daalein">
            </div>
            <button type="button" class="btn-otp">Send OTP</button>
        </form>
    </div>

</body>
</html>
