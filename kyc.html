<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>KYC | Skills Market</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial, sans-serif;
}

body{
    min-height:100vh;
    background:linear-gradient(135deg,#050505,#160000,#050505);
    color:#fff;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:25px 15px;
}

.form-container{
    width:100%;
    max-width:450px;
    background:#101010;
    border:1px solid #292929;
    border-radius:18px;
    padding:28px;
    box-shadow:0 15px 50px rgba(0,0,0,.55);
}

.logo{
    text-align:center;
    font-size:27px;
    font-weight:800;
    margin-bottom:5px;
}

.logo span{
    color:#e50914;
}

.subtitle{
    text-align:center;
    color:#999;
    font-size:13px;
    margin-bottom:25px;
}

h2{
    color:#fff;
    font-size:21px;
    margin-bottom:22px;
}

.form-group{
    margin-bottom:16px;
}

label{
    display:block;
    font-size:13px;
    color:#ccc;
    margin-bottom:7px;
    font-weight:bold;
}

input{
    width:100%;
    padding:12px 13px;
    border:1px solid #333;
    border-radius:9px;
    font-size:14px;
    background:#171717;
    color:#fff;
    outline:none;
}

input:focus{
    border-color:#e50914;
}

input::placeholder{
    color:#777;
}

input[readonly]{
    color:#bbb;
    cursor:not-allowed;
}

.btn-otp{
    width:100%;
    padding:13px;
    background:linear-gradient(135deg,#e50914,#b00008);
    border:none;
    color:white;
    font-size:15px;
    font-weight:bold;
    border-radius:25px;
    cursor:pointer;
    margin-top:8px;
    transition:.2s;
}

.btn-otp:hover{
    transform:translateY(-1px);
    opacity:.92;
}

.status{
    display:none;
    margin-top:15px;
    padding:12px;
    border-radius:9px;
    text-align:center;
    font-size:13px;
}

.success{
    background:#102a18;
    border:1px solid #236b38;
    color:#68dc88;
}

.note{
    margin-top:18px;
    text-align:center;
    color:#777;
    font-size:11px;
    line-height:1.5;
}

.back{
    display:block;
    text-align:center;
    margin-top:18px;
    color:#e50914;
    text-decoration:none;
    font-size:13px;
}

.back:hover{
    text-decoration:underline;
}

@media(max-width:480px){
    .form-container{
        padding:22px 18px;
    }

    .logo{
        font-size:24px;
    }

    h2{
        font-size:19px;
    }
}
</style>
</head>

<body>

<div class="form-container">

    <div class="logo">
        Skills <span>Market</span>
    </div>

    <div class="subtitle">
        Secure KYC & Bank Account Verification
    </div>

    <h2>Bank Account Information</h2>

    <form id="kycForm">

        <div class="form-group">
            <label>Holder Name</label>
            <input
                type="text"
                id="holderName"
                value=""
                placeholder="Enter account holder name"
                required>
        </div>

        <div class="form-group">
            <label>IFSC Code</label>
            <input
                type="text"
                id="ifsc"
                placeholder="Enter IFSC Code"
                maxlength="11"
                required>
        </div>

        <div class="form-group">
            <label>Account Number</label>
            <input
                type="text"
                id="accountNumber"
                placeholder="Enter Account Number"
                inputmode="numeric"
                required>
        </div>

        <div class="form-group">
            <label>Bank Name</label>
            <input
                type="text"
                id="bankName"
                placeholder="Enter Bank Name"
                required>
        </div>

        <div class="form-group">
            <label>UPI ID</label>
            <input
                type="text"
                id="upi"
                placeholder="example@upi">
        </div>

        <button type="button" class="btn-otp" onclick="sendOTP()">
            Send OTP
        </button>

        <div id="status" class="status success">
            ✓ Details saved successfully.
        </div>

    </form>

    <div class="note">
        Your bank information should only be submitted through your
        authenticated Skills Market account.
    </div>

    <a href="dashboard.html" class="back">
        ← Back to Dashboard
    </a>

</div>

<script>

function sendOTP(){

    const holderName =
        document.getElementById("holderName").value.trim();

    const ifsc =
        document.getElementById("ifsc").value.trim();

    const accountNumber =
        document.getElementById("accountNumber").value.trim();

    const bankName =
        document.getElementById("bankName").value.trim();

    if(!holderName || !ifsc || !accountNumber || !bankName){

        alert("Please fill all required details.");
        return;
    }

    /*
      OTP / Supabase verification will be connected here later.
      For now this only shows the verification status.
    */

    document.getElementById("status").style.display = "block";

    alert("OTP system will be connected with the KYC verification system.");
}

</script>

</body>
</html>
