<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skills Market — Learn. Grow. Build.</title>

<meta name="description" content="Skills Market is a modern digital learning and growth platform. Learn practical digital skills, build your knowledge and create new opportunities.">

<style>
:root{
    --red:#e50914;
    --red-light:#ff3842;
    --black:#050505;
    --black2:#090909;
    --surface:#101010;
    --surface2:#151515;
    --border:rgba(255,255,255,.09);
    --white:#fff;
    --gray:#999;
    --gray2:#6f6f6f;
    --green:#31d17c;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    font-family:Inter,Arial,Helvetica,sans-serif;
    background:var(--black);
    color:var(--white);
    line-height:1.6;
    overflow-x:hidden;
}

body:before{
    content:"";
    position:fixed;
    inset:0;
    pointer-events:none;
    background-image:
        linear-gradient(rgba(255,255,255,.018) 1px,transparent 1px),
        linear-gradient(90deg,rgba(255,255,255,.018) 1px,transparent 1px);
    background-size:60px 60px;
    mask-image:linear-gradient(to bottom,black,transparent 80%);
    z-index:-1;
}

a{
    color:inherit;
    text-decoration:none;
}

button{
    font-family:inherit;
}

.container{
    width:min(1180px,92%);
    margin:auto;
}

section{
    padding:100px 0;
}

/* ================= NAVBAR ================= */

.navbar{
    position:sticky;
    top:0;
    z-index:10000;
    background:rgba(5,5,5,.82);
    backdrop-filter:blur(20px);
    border-bottom:1px solid var(--border);
}

.nav-inner{
    height:78px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:25px;
}

.logo img{
    width:155px;
    max-height:58px;
    object-fit:contain;
}

.nav-links{
    display:flex;
    gap:27px;
    align-items:center;
}

.nav-links a{
    color:#d2d2d2;
    font-size:13px;
    font-weight:600;
    transition:.25s;
}

.nav-links a:hover{
    color:#fff;
}

.nav-actions{
    display:flex;
    align-items:center;
    gap:9px;
}

.btn{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    gap:8px;
    padding:13px 21px;
    border-radius:9px;
    border:1px solid transparent;
    font-size:13px;
    font-weight:750;
    transition:.25s;
    cursor:pointer;
}

.btn-red{
    background:var(--red);
    box-shadow:0 12px 30px rgba(229,9,20,.22);
}

.btn-red:hover{
    background:var(--red-light);
    transform:translateY(-2px);
}

.btn-dark{
    border-color:var(--border);
    background:#101010;
}

.btn-dark:hover{
    border-color:rgba(229,9,20,.55);
    transform:translateY(-2px);
}

.menu{
    display:none;
    background:none;
    border:0;
    color:#fff;
    font-size:27px;
    cursor:pointer;
}

/* ================= HERO ================= */

.hero{
    min-height:760px;
    display:flex;
    align-items:center;
    position:relative;
    overflow:hidden;
    background:
        radial-gradient(circle at 78% 42%,rgba(229,9,20,.24),transparent 25%),
        radial-gradient(circle at 15% 75%,rgba(229,9,20,.10),transparent 27%),
        var(--black);
}

.hero-glow{
    position:absolute;
    width:620px;
    height:620px;
    right:-190px;
    top:65px;
    border-radius:50%;
    border:1px solid rgba(229,9,20,.18);
    box-shadow:
        0 0 0 55px rgba(229,9,20,.025),
        0 0 0 115px rgba(229,9,20,.018);
}

.hero-grid{
    display:grid;
    grid-template-columns:1.05fr .95fr;
    align-items:center;
    gap:60px;
}

.hero-content{
    position:relative;
    z-index:2;
}

.eyebrow{
    display:inline-flex;
    align-items:center;
    gap:9px;
    padding:8px 13px;
    border-radius:100px;
    border:1px solid rgba(229,9,20,.35);
    background:rgba(229,9,20,.07);
    color:#ff5d65;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.2px;
    text-transform:uppercase;
}

.eyebrow i{
    width:7px;
    height:7px;
    border-radius:50%;
    background:var(--red);
    box-shadow:0 0 12px var(--red);
}

.hero h1{
    font-size:clamp(47px,6.5vw,78px);
    line-height:1;
    letter-spacing:-4px;
    margin:23px 0;
}

.hero h1 span{
    color:var(--red);
}

.hero-text{
    max-width:650px;
    color:#999;
    font-size:17px;
    line-height:1.8;
}

.hero-buttons{
    display:flex;
    flex-wrap:wrap;
    gap:12px;
    margin-top:31px;
}

.hero-trust{
    display:flex;
    align-items:center;
    gap:15px;
    margin-top:38px;
}

.faces{
    display:flex;
}

.face{
    width:34px;
    height:34px;
    margin-right:-8px;
    border-radius:50%;
    border:2px solid #050505;
    background:linear-gradient(145deg,#444,#151515);
    display:grid;
    place-items:center;
    font-size:10px;
    font-weight:800;
}

.hero-trust p{
    color:#888;
    font-size:12px;
}

.hero-trust strong{
    color:#fff;
}

/* HERO VISUAL */

.hero-visual{
    min-height:540px;
    position:relative;
    display:flex;
    align-items:center;
    justify-content:center;
}

.orbit{
    width:400px;
    height:400px;
    border-radius:50%;
    border:1px solid rgba(229,9,20,.20);
    position:absolute;
}

.orbit:before{
    content:"";
    position:absolute;
    width:10px;
    height:10px;
    border-radius:50%;
    background:var(--red);
    top:25px;
    left:70px;
    box-shadow:0 0 20px var(--red);
}

.logo-core{
    width:245px;
    height:245px;
    border-radius:35px;
    background:
        radial-gradient(circle at 50% 35%,rgba(229,9,20,.35),transparent 48%),
        linear-gradient(145deg,#1b1b1b,#080808);
    border:1px solid rgba(255,255,255,.12);
    display:grid;
    place-items:center;
    box-shadow:
        0 35px 100px rgba(0,0,0,.7),
        0 0 80px rgba(229,9,20,.12);
    position:relative;
    z-index:2;
}

.logo-core img{
    width:175px;
    max-height:175px;
    object-fit:contain;
}

.floating-card{
    position:absolute;
    z-index:4;
    background:rgba(18,18,18,.9);
    backdrop-filter:blur(15px);
    border:1px solid var(--border);
    border-radius:15px;
    padding:15px 17px;
    box-shadow:0 20px 50px rgba(0,0,0,.4);
}

.floating-card small{
    display:block;
    color:#777;
    font-size:10px;
    margin-bottom:3px;
}

.floating-card strong{
    font-size:16px;
}

.card-one{
    top:70px;
    right:0;
}

.card-two{
    bottom:70px;
    left:0;
}

.card-two strong{
    color:var(--green);
}

/* ================= STATS ================= */

.stats-strip{
    border-block:1px solid var(--border);
    background:#0a0a0a;
}

.stats-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
}

.stat-box{
    padding:30px 25px;
    text-align:center;
    border-right:1px solid var(--border);
}

.stat-box:last-child{
    border-right:0;
}

.stat-box strong{
    font-size:29px;
}

.stat-box span{
    display:block;
    color:#777;
    font-size:12px;
    margin-top:3px;
}

/* ================= HEADINGS ================= */

.section-heading{
    max-width:720px;
    margin:0 auto 50px;
    text-align:center;
}

.kicker{
    color:#f32b34;
    font-size:11px;
    font-weight:850;
    letter-spacing:2.2px;
    text-transform:uppercase;
}

.section-heading h2{
    font-size:clamp(34px,5vw,50px);
    line-height:1.08;
    letter-spacing:-1.8px;
    margin:11px 0 15px;
}

.section-heading p{
    color:#888;
    font-size:15px;
}

/* ================= BENEFITS ================= */

.benefits{
    background:#0b0b0b;
}

.benefit-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.benefit{
    padding:28px 20px;
    text-align:center;
    border:1px solid transparent;
    border-radius:16px;
    transition:.25s;
}

.benefit:hover{
    background:#111;
    border-color:var(--border);
    transform:translateY(-4px);
}

.benefit-icon{
    width:58px;
    height:58px;
    margin:0 auto 16px;
    border-radius:17px;
    display:grid;
    place-items:center;
    font-size:24px;
    background:rgba(229,9,20,.08);
    border:1px solid rgba(229,9,20,.2);
}

.benefit h3{
    font-size:15px;
}

.benefit p{
    color:#6f6f6f;
    font-size:12px;
    margin-top:6px;
}

/* ================= OPPORTUNITY ================= */

.opportunity{
    padding-top:90px;
}

.opportunity-box{
    min-height:410px;
    padding:65px;
    border-radius:28px;
    border:1px solid var(--border);
    overflow:hidden;
    position:relative;
    background:
        linear-gradient(105deg,#151515 0%,#0a0a0a 75%);
}

.opportunity-box:before{
    content:"";
    position:absolute;
    width:480px;
    height:480px;
    right:-130px;
    top:-40px;
    border-radius:50%;
    border:1px solid rgba(229,9,20,.17);
    box-shadow:0 0 0 45px rgba(229,9,20,.025);
}

.opportunity-box:after{
    content:"";
    position:absolute;
    width:350px;
    height:350px;
    right:-80px;
    top:30px;
    border-radius:50%;
    background:radial-gradient(circle,rgba(229,9,20,.3),transparent 65%);
}

.opportunity-content{
    max-width:650px;
    position:relative;
    z-index:2;
}

.opportunity-content h2{
    font-size:clamp(36px,5vw,56px);
    line-height:1.04;
    letter-spacing:-2px;
    margin:10px 0 17px;
}

.opportunity-content p{
    color:#8d8d8d;
    max-width:590px;
    margin-bottom:25px;
}

/* ================= ABOUT ================= */

.about{
    background:#0b0b0b;
}

.about-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:70px;
    align-items:center;
}

.about-copy h2{
    font-size:clamp(35px,5vw,49px);
    line-height:1.08;
    letter-spacing:-1.8px;
    margin:10px 0 18px;
}

.about-copy>p{
    color:#8d8d8d;
    font-size:15px;
    line-height:1.8;
}

.about-points{
    margin-top:28px;
}

.about-point{
    display:flex;
    gap:14px;
    padding:17px 0;
    border-bottom:1px solid var(--border);
}

.about-point-icon{
    width:42px;
    height:42px;
    flex-shrink:0;
    border-radius:11px;
    background:rgba(229,9,20,.08);
    border:1px solid rgba(229,9,20,.2);
    display:grid;
    place-items:center;
}

.about-point h3{
    font-size:15px;
    margin-bottom:3px;
}

.about-point p{
    color:#777;
    font-size:13px;
}

.about-visual{
    min-height:490px;
    border-radius:27px;
    border:1px solid var(--border);
    background:
        radial-gradient(circle at center,rgba(229,9,20,.25),transparent 32%),
        linear-gradient(145deg,#191919,#070707);
    display:grid;
    place-items:center;
    position:relative;
    overflow:hidden;
}

.about-visual img{
    width:220px;
    position:relative;
    z-index:3;
    filter:drop-shadow(0 25px 50px rgba(229,9,20,.25));
}

.about-ring{
    position:absolute;
    width:370px;
    height:370px;
    border-radius:50%;
    border:1px solid rgba(229,9,20,.18);
}

.about-label{
    position:absolute;
    padding:11px 15px;
    background:#121212;
    border:1px solid var(--border);
    border-radius:10px;
    color:#aaa;
    font-size:11px;
}

.about-label.one{
    top:65px;
    left:35px;
}

.about-label.two{
    bottom:70px;
    right:30px;
}

/* ================= PACKAGES ================= */

.packages{
    background:#050505;
}

.package-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.package{
    background:#101010;
    border:1px solid var(--border);
    border-radius:21px;
    padding:31px;
    position:relative;
    overflow:hidden;
    transition:.25s;
}

.package:hover{
    transform:translateY(-6px);
    border-color:rgba(229,9,20,.4);
}

.package.featured{
    border-color:rgba(229,9,20,.6);
    box-shadow:0 25px 70px rgba(229,9,20,.09);
}

.package.featured:before{
    content:"POPULAR";
    position:absolute;
    right:18px;
    top:18px;
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
    color:#fff;
    background:var(--red);
    padding:6px 9px;
    border-radius:5px;
}

.package-top{
    color:#ff5058;
    font-size:11px;
    font-weight:800;
    letter-spacing:1.4px;
    text-transform:uppercase;
}

.package h3{
    font-size:25px;
    margin:9px 0;
}

.package-description{
    color:#777;
    font-size:13px;
    min-height:45px;
}

.package-line{
    height:1px;
    background:var(--border);
    margin:23px 0;
}

.package ul{
    list-style:none;
}

.package li{
    color:#aaa;
    font-size:13px;
    padding:7px 0;
}

.package li:before{
    content:"✓";
    color:var(--red);
    font-weight:bold;
    margin-right:9px;
}

/* ================= COURSES ================= */

.courses{
    background:#0b0b0b;
}

.course-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.course{
    border:1px solid var(--border);
    background:#111;
    border-radius:19px;
    overflow:hidden;
    transition:.25s;
}

.course:hover{
    transform:translateY(-6px);
    border-color:rgba(229,9,20,.45);
}

.course-cover{
    height:190px;
    padding:22px;
    display:flex;
    flex-direction:column;
    justify-content:space-between;
    background:
        radial-gradient(circle at 80% 20%,rgba(229,9,20,.45),transparent 35%),
        linear-gradient(135deg,#242424,#101010);
}

.course-cover.red{
    background:
        radial-gradient(circle at 80% 20%,rgba(255,255,255,.16),transparent 35%),
        linear-gradient(135deg,#e50914,#540006);
}

.course-cover.dark{
    background:
        radial-gradient(circle at 80% 20%,rgba(229,9,20,.4),transparent 35%),
        linear-gradient(135deg,#191919,#080808);
}

.course-tag{
    display:inline-block;
    width:max-content;
    padding:5px 8px;
    border-radius:5px;
    background:rgba(0,0,0,.35);
    font-size:9px;
    font-weight:800;
    letter-spacing:1px;
}

.course-cover strong{
    font-size:27px;
    line-height:1;
    letter-spacing:-1px;
}

.course-body{
    padding:22px;
}

.course-meta{
    display:flex;
    justify-content:space-between;
    color:#6f6f6f;
    font-size:11px;
    margin-bottom:8px;
}

.course-body h3{
    font-size:19px;
}

.course-body p{
    color:#777;
    font-size:13px;
    margin:7px 0 18px;
}

/* ================= AFFILIATE ================= */

.affiliate{
    background:
        linear-gradient(180deg,#070707,#0d0d0d);
}

.affiliate-box{
    border:1px solid rgba(229,9,20,.23);
    border-radius:28px;
    padding:55px;
    background:
        radial-gradient(circle at 85% 50%,rgba(229,9,20,.18),transparent 30%),
        #101010;
}

.affiliate-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:55px;
    align-items:center;
}

.affiliate-copy h2{
    font-size:clamp(34px,5vw,50px);
    line-height:1.08;
    margin:10px 0 16px;
}

.affiliate-copy p{
    color:#888;
}

.affiliate-features{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:13px;
}

.affiliate-feature{
    padding:18px;
    background:#151515;
    border:1px solid var(--border);
    border-radius:13px;
}

.affiliate-feature b{
    display:block;
    font-size:14px;
}

.affiliate-feature span{
    color:#777;
    font-size:11px;
}

/* ================= TEAM ================= */

.team{
    background:#0b0b0b;
}

.team-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:20px;
}

.person{
    padding:32px;
    text-align:center;
    background:#121212;
    border:1px solid var(--border);
    border-radius:19px;
}

.person-avatar{
    width:108px;
    height:108px;
    margin:0 auto 18px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:
        radial-gradient(circle at 35% 25%,#333,transparent 35%),
        linear-gradient(145deg,#242424,#0d0d0d);
    border:2px solid rgba(229,9,20,.4);
    font-size:27px;
    font-weight:850;
}

.person h3{
    font-size:18px;
}

.person p{
    color:#777;
    font-size:12px;
    margin-top:4px;
}

/* ================= INSTRUCTORS ================= */

.instructors{
    background:#050505;
}

.instructor-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:16px;
}

.instructor{
    padding:25px 18px;
    text-align:center;
    background:#101010;
    border:1px solid var(--border);
    border-radius:16px;
}

.instructor-avatar{
    width:84px;
    height:84px;
    margin:0 auto 15px;
    border-radius:50%;
    display:grid;
    place-items:center;
    background:linear-gradient(145deg,#282828,#111);
    border:1px solid rgba(229,9,20,.35);
    font-weight:800;
}

.instructor h3{
    font-size:15px;
}

.instructor p{
    color:#777;
    font-size:11px;
}

/* ================= TESTIMONIALS ================= */

.testimonials{
    background:#0b0b0b;
}

.testimonial-grid{
    display:grid;
    grid-template-columns:repeat(3,1fr);
    gap:18px;
}

.testimonial{
    padding:27px;
    background:#121212;
    border:1px solid var(--border);
    border-radius:17px;
}

.stars{
    color:#ffbf00;
    letter-spacing:2px;
    font-size:13px;
    margin-bottom:14px;
}

.testimonial>p{
    color:#999;
    font-size:13px;
    line-height:1.8;
    min-height:70px;
}

.testimonial-user{
    display:flex;
    align-items:center;
    gap:10px;
    margin-top:20px;
}

.user-avatar{
    width:40px;
    height:40px;
    border-radius:50%;
    background:var(--red);
    display:grid;
    place-items:center;
    font-size:12px;
    font-weight:800;
}

.testimonial-user strong{
    font-size:12px;
}

.testimonial-user small{
    display:block;
    color:#666;
    font-size:10px;
}

/* ================= SKILLS ================= */

.skills{
    background:#050505;
}

.skills-grid{
    display:grid;
    grid-template-columns:repeat(4,1fr);
    gap:15px;
}

.skill{
    padding:24px;
    border:1px solid var(--border);
    border-radius:16px;
    background:#101010;
    transition:.25s;
}

.skill:hover{
    transform:translateY(-4px);
    border-color:rgba(229,9,20,.35);
}

.skill-icon{
    font-size:25px;
}

.skill h3{
    font-size:16px;
    margin-top:12px;
}

.skill p{
    color:#6f6f6f;
    font-size:12px;
    margin-top:4px;
}

/* ================= FAQ ================= */

.faq{
    background:#0b0b0b;
}

.faq-wrap{
    max-width:850px;
    margin:auto;
}

.faq-item{
    border-bottom:1px solid var(--border);
}

.faq-question{
    width:100%;
    background:none;
    border:0;
    color:#fff;
    display:flex;
    justify-content:space-between;
    align-items:center;
    padding:21px 2px;
    text-align:left;
    cursor:pointer;
    font-size:14px;
    font-weight:700;
}

.faq-question span{
    color:var(--red);
    font-size:21px;
}

.faq-answer{
    display:none;
    color:#777;
    font-size:13px;
    padding:0 2px 21px;
    line-height:1.8;
}

.faq-item.open .faq-answer{
    display:block;
}

/* ================= CTA ================= */

.final-cta{
    padding:85px 0;
    background:
        radial-gradient(circle at 80% 50%,rgba(255,255,255,.14),transparent 25%),
        linear-gradient(105deg,#e50914,#900006);
}
