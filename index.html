<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Skills Market | Learn. Grow. Build.</title>
<meta name="description" content="Skills Market - Learn practical digital skills, grow your confidence and build better opportunities.">

<style>
:root{
  --red:#ff2020;
  --red2:#c90000;
  --black:#050505;
  --dark:#0b0b0b;
  --card:#111111;
  --soft:#171717;
  --white:#ffffff;
  --muted:#a8a8a8;
  --border:rgba(255,255,255,.09);
}

*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial,Helvetica,sans-serif;
  scroll-behavior:smooth;
}

body{
  background:var(--black);
  color:var(--white);
  line-height:1.6;
  overflow-x:hidden;
}

a{
  color:inherit;
  text-decoration:none;
}

.container{
  width:min(1180px,92%);
  margin:auto;
}

section{
  padding:95px 0;
}

.section-head{
  max-width:720px;
  margin:0 auto 55px;
  text-align:center;
}

.section-tag{
  display:inline-block;
  color:#ff3b3b;
  font-size:13px;
  font-weight:800;
  text-transform:uppercase;
  letter-spacing:2px;
  margin-bottom:12px;
}

.section-head h2{
  font-size:clamp(32px,5vw,52px);
  line-height:1.1;
  margin-bottom:16px;
}

.section-head p{
  color:var(--muted);
  font-size:16px;
}

/* NAVBAR */

header{
  position:sticky;
  top:0;
  z-index:1000;
  background:rgba(5,5,5,.92);
  backdrop-filter:blur(15px);
  border-bottom:1px solid var(--border);
}

.navbar{
  min-height:76px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:25px;
}

.logo{
  display:flex;
  align-items:center;
  gap:10px;
  font-size:22px;
  font-weight:900;
}

.logo img{
  width:45px;
  height:45px;
  object-fit:contain;
  border-radius:50%;
}

.logo span{
  color:#fff;
}

.logo b{
  color:var(--red);
}

.nav-links{
  display:flex;
  align-items:center;
  gap:27px;
}

.nav-links a{
  color:#ddd;
  font-size:14px;
  font-weight:600;
  transition:.25s;
}

.nav-links a:hover{
  color:var(--red);
}

.nav-buttons{
  display:flex;
  gap:10px;
  align-items:center;
}

.btn{
  display:inline-flex;
  align-items:center;
  justify-content:center;
  padding:12px 21px;
  border-radius:7px;
  font-weight:800;
  font-size:14px;
  transition:.25s;
  cursor:pointer;
  border:1px solid transparent;
}

.btn-red{
  background:var(--red);
  color:#fff;
}

.btn-red:hover{
  background:#ff3b3b;
  transform:translateY(-2px);
}

.btn-outline{
  border-color:#444;
  color:#fff;
  background:transparent;
}

.btn-outline:hover{
  border-color:var(--red);
  color:var(--red);
}

.menu-btn{
  display:none;
  background:none;
  border:0;
  color:white;
  font-size:28px;
  cursor:pointer;
}

/* HERO */

.hero{
  min-height:720px;
  display:flex;
  align-items:center;
  position:relative;
  overflow:hidden;
  background:
    radial-gradient(circle at 80% 35%,rgba(255,20,20,.18),transparent 30%),
    radial-gradient(circle at 15% 70%,rgba(255,0,0,.08),transparent 25%),
    #050505;
}

.hero::before{
  content:"";
  position:absolute;
  width:500px;
  height:500px;
  border:1px solid rgba(255,40,40,.12);
  border-radius:50%;
  right:-180px;
  top:100px;
}

.hero-grid{
  display:grid;
  grid-template-columns:1.08fr .92fr;
  align-items:center;
  gap:60px;
}

.hero-content{
  position:relative;
  z-index:2;
}

.hero-badge{
  display:inline-flex;
  padding:8px 14px;
  border:1px solid rgba(255,40,40,.3);
  background:rgba(255,20,20,.08);
  border-radius:30px;
  color:#ff5b5b;
  font-size:13px;
  font-weight:700;
  margin-bottom:20px;
}

.hero h1{
  font-size:clamp(45px,6vw,78px);
  line-height:.98;
  letter-spacing:-3px;
  margin-bottom:24px;
}

.hero h1 span{
  color:var(--red);
}

.hero p{
  color:#bcbcbc;
  max-width:600px;
  font-size:18px;
  margin-bottom:32px;
}

.hero-actions{
  display:flex;
  gap:13px;
  flex-wrap:wrap;
}

.hero-note{
  margin-top:25px;
  display:flex;
  gap:20px;
  flex-wrap:wrap;
  color:#999;
  font-size:13px;
}

.hero-visual{
  min-height:500px;
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero-circle{
  width:330px;
  height:330px;
  border-radius:50%;
  border:1px solid rgba(255,30,30,.35);
  background:radial-gradient(circle,rgba(255,20,20,.14),rgba(10,10,10,.4));
  box-shadow:0 0 100px rgba(255,0,0,.12);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.hero-circle img{
  width:190px;
  height:190px;
  object-fit:contain;
  border-radius:50%;
  filter:drop-shadow(0 15px 35px rgba(255,0,0,.25));
}

.float-card{
  position:absolute;
  background:rgba(20,20,20,.9);
  border:1px solid var(--border);
  border-radius:14px;
  padding:16px 18px;
  box-shadow:0 15px 50px rgba(0,0,0,.4);
  backdrop-filter:blur(10px);
}

.float-card strong{
  display:block;
  font-size:16px;
}

.float-card small{
  color:#999;
}

.card-one{top:45px;left:15px;}
.card-two{right:0;top:145px;}
.card-three{bottom:55px;left:45px;}

/* TRUST */

.trust{
  padding:25px 0;
  background:#0b0b0b;
  border-top:1px solid var(--border);
  border-bottom:1px solid var(--border);
}

.trust-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
}

.trust-item{
  text-align:center;
  padding:18px;
  border-right:1px solid var(--border);
}

.trust-item:last-child{
  border-right:0;
}

.trust-item strong{
  display:block;
  font-size:16px;
  margin-bottom:4px;
}

.trust-item span{
  color:#888;
  font-size:13px;
}

/* OPPORTUNITY */

.opportunity{
  background:#080808;
}

.opportunity-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:25px;
}

.opportunity-card{
  min-height:330px;
  border:1px solid var(--border);
  border-radius:22px;
  padding:45px;
  display:flex;
  flex-direction:column;
  justify-content:flex-end;
  overflow:hidden;
  position:relative;
  background:
    linear-gradient(145deg,rgba(255,30,30,.16),transparent 55%),
    #101010;
}

.opportunity-card:nth-child(2){
  background:
    linear-gradient(145deg,rgba(255,255,255,.07),transparent 55%),
    #101010;
}

.opportunity-card::after{
  content:"SM";
  position:absolute;
  right:25px;
  top:20px;
  font-size:110px;
  font-weight:900;
  color:rgba(255,255,255,.025);
}

.opportunity-card h3{
  font-size:35px;
  max-width:450px;
  line-height:1.1;
  position:relative;
  z-index:2;
}

.opportunity-card p{
  color:#999;
  margin-top:15px;
  max-width:520px;
  position:relative;
  z-index:2;
}

/* ABOUT */

.about-grid{
  display:grid;
  grid-template-columns:.9fr 1.1fr;
  gap:70px;
  align-items:center;
}

.about-visual{
  min-height:430px;
  border-radius:25px;
  background:
    radial-gradient(circle at center,rgba(255,20,20,.2),transparent 45%),
    #101010;
  border:1px solid var(--border);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
  overflow:hidden;
}

.about-visual img{
  width:220px;
  height:220px;
  object-fit:contain;
  border-radius:50%;
  position:relative;
  z-index:2;
}

.about-ring{
  position:absolute;
  width:310px;
  height:310px;
  border:1px solid rgba(255,30,30,.25);
  border-radius:50%;
}

.about-content h2{
  font-size:clamp(35px,5vw,55px);
  line-height:1.08;
  margin:10px 0 20px;
}

.about-content>p{
  color:#aaa;
  margin-bottom:28px;
}

.mission-box{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  margin-bottom:28px;
}

.mission{
  padding:22px;
  background:#101010;
  border:1px solid var(--border);
  border-radius:14px;
}

.mission h3{
  margin-bottom:8px;
}

.mission p{
  color:#999;
  font-size:14px;
}

/* PACKAGES */

.packages{
  background:#080808;
}

.package-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.package{
  background:#101010;
  border:1px solid var(--border);
  border-radius:18px;
  padding:30px;
  position:relative;
  transition:.3s;
}

.package:hover{
  transform:translateY(-8px);
  border-color:rgba(255,30,30,.55);
}

.package.featured{
  border-color:var(--red);
  box-shadow:0 20px 70px rgba(255,0,0,.1);
}

.popular{
  position:absolute;
  top:18px;
  right:18px;
  background:var(--red);
  padding:5px 10px;
  border-radius:20px;
  font-size:10px;
  font-weight:900;
}

.package-icon{
  width:50px;
  height:50px;
  border-radius:12px;
  background:rgba(255,30,30,.1);
  display:flex;
  align-items:center;
  justify-content:center;
  font-size:22px;
  margin-bottom:20px;
}

.package h3{
  font-size:25px;
  margin-bottom:10px;
}

.package>p{
  color:#999;
  font-size:14px;
  min-height:65px;
}

.package ul{
  list-style:none;
  margin:22px 0;
}

.package li{
  color:#bbb;
  padding:8px 0;
  font-size:14px;
  border-bottom:1px solid rgba(255,255,255,.05);
}

.package li::before{
  content:"✓";
  color:#ff3333;
  font-weight:bold;
  margin-right:9px;
}

/* WHY */

.why-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:60px;
  align-items:center;
}

.why-content h2{
  font-size:clamp(35px,5vw,55px);
  line-height:1.05;
  margin:10px 0 20px;
}

.why-content>p{
  color:#999;
  margin-bottom:28px;
}

.feature-list{
  display:grid;
  gap:15px;
}

.feature{
  display:flex;
  gap:15px;
  padding:18px;
  border:1px solid var(--border);
  border-radius:14px;
  background:#0d0d0d;
}

.feature-icon{
  width:45px;
  height:45px;
  flex:0 0 45px;
  border-radius:10px;
  background:rgba(255,20,20,.1);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ff4040;
}

.feature h3{
  font-size:16px;
  margin-bottom:4px;
}

.feature p{
  color:#888;
  font-size:13px;
}

.stats-box{
  min-height:430px;
  border-radius:25px;
  border:1px solid var(--border);
  padding:35px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:15px;
  background:
    radial-gradient(circle at 50% 20%,rgba(255,0,0,.14),transparent 40%),
    #101010;
}

.stat{
  border:1px solid var(--border);
  border-radius:15px;
  padding:25px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.stat strong{
  font-size:40px;
  color:#fff;
}

.stat span{
  color:#888;
  font-size:13px;
}

/* FOUNDER */

.founder{
  background:#080808;
}

.founder-card{
  border:1px solid var(--border);
  border-radius:25px;
  overflow:hidden;
  display:grid;
  grid-template-columns:.7fr 1.3fr;
  background:#101010;
}

.founder-photo{
  min-height:450px;
  background:
    radial-gradient(circle at center,rgba(255,20,20,.18),transparent 50%),
    #0c0c0c;
  display:flex;
  align-items:center;
  justify-content:center;
}

.founder-photo img{
  width:220px;
  height:220px;
  border-radius:50%;
  object-fit:contain;
}

.founder-content{
  padding:55px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.founder-content h2{
  font-size:42px;
  margin:8px 0 5px;
}

.founder-role{
  color:#ff3939;
  font-weight:800;
  margin-bottom:20px;
}

.founder-content p{
  color:#999;
  margin-bottom:20px;
}

/* COURSES */

.course-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.course{
  border:1px solid var(--border);
  border-radius:18px;
  overflow:hidden;
  background:#101010;
  transition:.3s;
}

.course:hover{
  transform:translateY(-6px);
}

.course-cover{
  height:175px;
  background:
    linear-gradient(135deg,rgba(255,0,0,.25),transparent),
    linear-gradient(45deg,#171717,#080808);
  display:flex;
  align-items:center;
  justify-content:center;
  position:relative;
}

.course-cover span{
  font-size:52px;
  font-weight:900;
  color:rgba(255,255,255,.09);
}

.course-body{
  padding:23px;
}

.course-tag{
  color:#ff3b3b;
  font-size:11px;
  font-weight:900;
  text-transform:uppercase;
}

.course h3{
  font-size:19px;
  margin:8px 0;
}

.course p{
  color:#888;
  font-size:13px;
  margin-bottom:15px;
}

.course-bottom{
  display:flex;
  justify-content:space-between;
  align-items:center;
}

.rating{
  color:#ffb000;
  font-size:13px;
}

.course-link{
  color:#ff3b3b;
  font-size:13px;
  font-weight:800;
}

/* TEAM */

.team{
  background:#080808;
}

.team-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.team-card{
  background:#101010;
  border:1px solid var(--border);
  border-radius:18px;
  padding:35px;
  text-align:center;
}

.team-photo{
  width:110px;
  height:110px;
  margin:0 auto 20px;
  border-radius:50%;
  background:linear-gradient(145deg,#241010,#111);
  border:1px solid rgba(255,30,30,.25);
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ff4040;
  font-size:35px;
  font-weight:900;
}

.team-card h3{
  margin-bottom:5px;
}

.team-card .role{
  color:#ff3b3b;
  font-size:13px;
  font-weight:700;
  margin-bottom:12px;
}

.team-card p{
  color:#888;
  font-size:13px;
}

/* SKILLS */

.skills{
  background:#080808;
}

.skill-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:14px;
}

.skill{
  padding:22px;
  border:1px solid var(--border);
  background:#101010;
  border-radius:14px;
  transition:.25s;
}

.skill:hover{
  border-color:#ff3030;
  transform:translateY(-4px);
}

.skill span{
  font-size:25px;
  display:block;
  margin-bottom:12px;
}

.skill h3{
  font-size:16px;
}

.skill p{
  color:#777;
  font-size:12px;
}

/* TESTIMONIAL */

.testimonial-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:20px;
}

.testimonial{
  background:#101010;
  border:1px solid var(--border);
  border-radius:18px;
  padding:28px;
}

.stars{
  color:#ffb000;
  margin-bottom:15px;
}

.testimonial p{
  color:#aaa;
  font-size:14px;
  margin-bottom:22px;
}

.testimonial-user{
  display:flex;
  align-items:center;
  gap:12px;
}

.user-circle{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#1b1b1b;
  display:flex;
  align-items:center;
  justify-content:center;
  color:#ff3b3b;
  font-weight:900;
}

.testimonial-user strong{
  font-size:14px;
}

.testimonial-user span{
  display:block;
  color:#777;
  font-size:11px;
}

/* AFFILIATE */

.affiliate{
  background:
    radial-gradient(circle at 80% 50%,rgba(255,0,0,.14),transparent 35%),
    #090909;
}

.affiliate-box{
  border:1px solid rgba(255,30,30,.3);
  border-radius:25px;
  padding:65px;
  background:linear-gradient(120deg,rgba(255,20,20,.08),rgba(255,255,255,.02));
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:50px;
  align-items:center;
}

.affiliate-box h2{
  font-size:clamp(35px,5vw,55px);
  line-height:1.05;
  margin:10px 0 18px;
}

.affiliate-box p{
  color:#999;
}

.affiliate-list{
  display:grid;
  gap:13px;
}

.affiliate-item{
  padding:17px;
  border:1px solid var(--border);
  border-radius:12px;
  background:#0e0e0e;
}

.affiliate-item strong{
  display:block;
  margin-bottom:3px;
}

.affiliate-item span{
  color:#777;
  font-size:12px;
}

/* FAQ */

.faq{
  background:#080808;
}

.faq-wrap{
  max-width:850px;
  margin:auto;
}

.faq-item{
  border-bottom:1px solid var(--border);
}

.faq-question{
  width:100%;
  background:none;
  color:#fff;
  border:0;
  padding:22px 5px;
  display:flex;
  justify-content:space-between;
  align-items:center;
  text-align:left;
  font-size:16px;
  font-weight:700;
  cursor:pointer;
}

.faq-question span{
  color:#ff3030;
  font-size:23px;
}

.faq-answer{
  max-height:0;
  overflow:hidden;
  transition:.3s;
}

.faq-answer p{
  color:#888;
  padding:0 5px 20px;
  font-size:14px;
}

/* CTA */

.cta{
  padding:80px 0;
}

.cta-box{
  text-align:center;
  padding:75px 25px;
  border-radius:25px;
  border:1px solid rgba(255,30,30,.25);
  background:
    radial-gradient(circle,rgba(255,0,0,.14),transparent 55%),
    #101010;
}

.cta-box h2{
  font-size:clamp(35px,5vw,58px);
  line-height:1.05;
  margin-bottom:17px;
}

.cta-box p{
  color:#999;
  max-width:650px;
  margin:0 auto 27px;
}

/* FOOTER */

footer{
  background:#050505;
  border-top:1px solid var(--border);
  padding:65px 0 25px;
}

.footer-grid{
  display:grid;
  grid-template-columns:1.3fr 1fr 1fr 1fr;
  gap:45px;
  padding-bottom:50px;
}

.footer-brand p{
  color:#777;
  font-size:13px;
  max-width:320px;
  margin-top:15px;
}

.footer-title{
  font-weight:800;
  margin-bottom:18px;
}

.footer-links{
  display:grid;
  gap:11px;
}

.footer-links a{
  color:#777;
  font-size:13px;
}

.footer-links a:hover{
  color:#ff3b3b;
}

.footer-bottom{
  border-top:1px solid var(--border);
  padding-top:22px;
  color:#666;
  font-size:12px;
  display:flex;
  justify-content:space-between;
  gap:15px;
}

/* RESPONSIVE */

@media(max-width:1000px){

  .nav-links{
    display:none;
  }

  .nav-links.show{
    display:flex;
    position:absolute;
    top:76px;
    left:0;
    width:100%;
    padding:22px;
    background:#080808;
    border-bottom:1px solid var(--border);
    flex-direction:column;
    align-items:flex-start;
    gap:18px;
  }

  .menu-btn{
    display:block;
  }

  .nav-buttons{
    display:none;
  }

  .hero-grid,
  .about-grid,
  .why-grid,
  .founder-card,
  .affiliate-box{
    grid-template-columns:1fr;
  }

  .hero{
    padding:80px 0;
  }

  .hero-visual{
    min-height:400px;
  }

  .package-grid,
  .course-grid,
  .team-grid{
    grid-template-columns:repeat(2,1fr);
  }

  .skill-grid{
    grid-template-columns:repeat(2,1fr);
  }
