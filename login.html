<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Login | Skills Market</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:"Segoe UI",Arial,sans-serif;
}

html,body{
    min-height:100%;
}

body{
    background:#050505;
    color:#fff;
    overflow-x:hidden;
}

/* ================= BACKGROUND ================= */

.background{
    position:fixed;
    inset:0;
    z-index:-5;
    overflow:hidden;
    background:
        radial-gradient(
            circle at 50% 25%,
            rgba(255,0,0,.10),
            transparent 35%
        ),
        linear-gradient(
            135deg,
            #050505,
            #0b0000 55%,
            #050505
        );
}

.orb{
    position:absolute;
    border-radius:50%;
    filter:blur(3px);
    opacity:.45;
    animation:floatOrb 10s ease-in-out infinite;
}

.orb1{
    width:280px;
    height:280px;
    left:-100px;
    top:-80px;
    background:radial-gradient(
        circle,
        rgba(255,20,20,.28),
        transparent 70%
    );
}

.orb2{
    width:350px;
    height:350px;
    right:-130px;
    bottom:-100px;
    background:radial-gradient(
        circle,
        rgba(220,0,0,.22),
        transparent 70%
    );
    animation-delay:-4s;
}

.orb3{
    width:170px;
    height:170px;
    left:45%;
    top:45%;
    background:radial-gradient(
        circle,
        rgba(255,30,30,.12),
        transparent 70%
    );
    animation-delay:-7s;
}

@keyframes floatOrb{
    0%,100%{
        transform:translateY(0) scale(1);
    }

    50%{
        transform:translateY(-25px) scale(1.08);
    }
}

/* ================= PARTICLES ================= */

.particle{
    position:absolute;
    width:5px;
    height:5px;
    border-radius:50%;
    background:#ff1e38;
    opacity:.5;
    animation:particleMove 7s ease-in-out infinite;
}

.p1{left:12%;top:22%;animation-delay:0s;}
.p2{left:82%;top:30%;animation-delay:2s;}
.p3{left:22%;top:72%;animation-delay:4s;}
.p4{left:88%;top:75%;animation-delay:1s;}
.p5{left:50%;top:15%;animation-delay:3s;}

@keyframes particleMove{
    0%,100%{
        transform:translateY(0);
        opacity:.25;
    }

    50%{
        transform:translateY(-25px);
        opacity:.8;
    }
}

/* ================= PAGE ================= */

.page{
    min-height:100vh;
    display:flex;
    flex-direction:column;
}

/* ================= NAVBAR ================= */

.navbar{
    height:72px;
    width:100%;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:0 5%;
    background:rgba(8,8,8,.92);
    border-bottom:1px solid rgba(255,255,255,.07);
    backdrop-filter:blur(12px);
    position:relative;
    z-index:10;
}

.logo{
    color:#fff;
    text-decoration:none;
    font-size:24px;
    font-weight:800;
    letter-spacing:-.5px;
}

.logo span{
    color:#ff1e38;
}

.nav-links{
    display:flex;
    align-items:center;
    gap:8px;
}

.nav-links a{
    text-decoration:none;
    color:#aaa;
    font-size:13px;
    padding:9px 13px;
    border-radius:8px;
    transition:.25s;
}

.nav-links a:hover{
    color:#fff;
    background:#181818;
}

.nav-links .register{
    color:#fff;
    background:#ff1e38;
}

.nav-links .register:hover{
    background:#d9162e;
}

/* ================= MAIN ================= */

.main{
    flex:1;
    min-height:calc(100vh - 150px);
    display:flex;
    align-items:center;
    justify-content:center;
    padding:55px 18px;
}

/* ================= LOGIN CARD ================= */

.login-card{
    width:100%;
    max-width:470px;
    padding:42px 38px 36px;
    background:rgba(12,12,12,.84);
    border:1px solid rgba(255,30,56,.55);
    border-radius:20px;
    box-shadow:
        0 25px 80px rgba(0,0,0,.75),
        0 0 35px rgba(255,0,30,.07);
    backdrop-filter:blur(18px);
    position:relative;
    overflow:hidden;
}

.login-card::before{
    content:"";
    position:absolute;
    top:0;
    left:15%;
    width:70%;
    height:1px;
    background:linear-gradient(
        90deg,
        transparent,
        #ff1e38,
        transparent
    );
}

/* ================= TITLE ================= */

.title{
    text-align:center;
    margin-bottom:34px;
}

.title h1{
    font-size:34px;
    font-weight:800;
    letter-spacing:-.8px;
}

.title h1 span{
    color:#ff1e38;
}

.title p{
    color:#777;
    font-size:15px;
    margin-top:9px;
}

/* ================= MESSAGE ================= */

.message{
    display:none;
    padding:12px 14px;
    border-radius:9px;
    margin-bottom:18px;
    font-size:13px;
    line-height:1.5;
}

.message.error{
    display:block;
    color:#ffb0b0;
    background:rgba(255,0,0,.08);
    border:1px solid rgba(255,0,0,.25);
}

.message.success{
    display:block;
    color:#8df0aa;
    background:rgba(0,200,80,.08);
    border:1px solid rgba(0,200,80,.2);
}

/* ================= FORM ================= */

.form-group{
    margin-bottom:22px;
}

.form-group label{
    display:block;
    color:#eee;
    font-size:15px;
    margin-bottom:9px;
    font-weight:500;
}

.form-control{
    width:100%;
    height:53px;
    padding:0 16px;
    background:rgba(20,20,20,.75);
    border:1px solid rgba(255,255,255,.10);
    border-radius:10px;
    outline:none;
    color:#fff;
    font-size:14px;
    transition:.25s;
}

.form-control::placeholder{
    color:#666;
}

.form-control:focus{
    border-color:#ff1e38;
    box-shadow:0 0 0 3px rgba(255,30,56,.08);
    background:#151515;
}

/* ================= PASSWORD ================= */

.password-box{
    position:relative;
}

.password-box .form-control{
    padding-right:70px;
}

.password-toggle{
    position:absolute;
    right:10px;
    top:50%;
    transform:translateY(-50%);
    border:0;
    background:transparent;
    color:#777;
    cursor:pointer;
    font-size:11px;
    font-weight:700;
}

.password-toggle:hover{
    color:#ff1e38;
}

/* ================= OPTIONS ================= */

.options{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    margin:5px 0 25px;
}

.remember{
    display:flex;
    align-items:center;
    gap:8px;
    color:#999;
    font-size:13px;
    cursor:pointer;
}

.remember input{
    width:16px;
    height:16px;
    accent-color:#ff1e38;
}

.forgot{
    color:#999;
    text-decoration:none;
    font-size:13px;
}

.forgot:hover{
    color:#ff1e38;
}

/* ================= LOGIN BUTTON ================= */

.login-btn{
    width:100%;
    height:53px;
    border:0;
    border-radius:10px;
    background:linear-gradient(
        135deg,
        #ff263f,
        #d90f29
    );
    color:#fff;
    font-size:15px;
    font-weight:700;
    cursor:pointer;
    box-shadow:0 10px 28px rgba(255,20,45,.22);
    transition:.25s;
}

.login-btn:hover{
    transform:translateY(-2px);
    box-shadow:0 14px 35px rgba(255,20,45,.32);
}

.login-btn:disabled{
    opacity:.6;
    cursor:not-allowed;
    transform:none;
}

/* ================= REGISTER ================= */

.register-text{
    text-align:center;
    margin-top:24px;
    color:#777;
    font-size:13px;
}

.register-text a{
    color:#ff1e38;
    font-weight:600;
    text-decoration:none;
}

.register-text a:hover{
    text-decoration:underline;
}

/* ================= FOOTER ================= */

.footer{
    text-align:center;
    padding:20px;
    border-top:1px solid rgba(255,255,255,.06);
    background:rgba(0,0,0,.45);
}

.footer p{
    color:#666;
    font-size:11px;
    margin-bottom:8px;
}

.footer-links{
    display:flex;
    justify-content:center;
    align-items:center;
    flex-wrap:wrap;
    gap:9px;
}

.footer-links a{
    color:#777;
    font-size:11px;
    text-decoration:none;
}

.footer-links a:hover{
    color:#ff1e38;
}

.footer-links span{
    color:#444;
}

/* ================= MOBILE ================= */

@media(max-width:700px){

    .navbar{
        height:65px;
        padding:0 18px;
    }

    .logo{
        font-size:21px;
    }

    .nav-links a:not(.register){
        display:none;
    }

    .nav-links .register{
        font-size:12px;
        padding:8px 12px;
    }

    .main{
        padding:35px 14px;
        align-items:center;
    }

    .login-card{
        padding:34px 20px 30px;
        border-radius:17px;
    }

    .title h1{
        font-size:29px;
    }

    .title p{
        font-size:14px;
    }

    .form-group label{
        font-size:14px;
    }

    .remember,
    .forgot{
        font-size:12px;
    }

    .footer{
        padding:17px 12px;
    }
}
</style>
</head>

<body>

<!-- ================= BACKGROUND ================= -->

<div class="background">

    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>

    <div class="particle p1"></div>
    <div class="particle p2"></div>
    <div class="particle p3"></div>
    <div class="particle p4"></div>
    <div class="particle p5"></div>

</div>


<div class="page">

<!-- ================= NAVBAR ================= -->

<nav class="navbar">

    <a href="index.html" class="logo">
        Skills<span>Market</span>
    </a>

    <div class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="courses.html">
            Courses
        </a>

        <a href="index.html#packages">
            Packages
        </a>

        <!-- REGISTER → PACKAGES -->

        <a
            href="index.html#packages"
            class="register">
            Register
        </a>

    </div>

</nav>


<!-- ================= MAIN ================= -->

<main class="main">

<div class="login-card">

    <div class="title">

        <h1>
            Welcome Back <span>👋</span>
        </h1>

        <p>
            Login to continue your journey
        </p>

    </div>


    <div
        id="message"
        class="message">
    </div>


    <form id="loginForm">

        <!-- EMAIL -->

        <div class="form-group">

            <label for="email">
                Registered Email
            </label>

            <input
                type="email"
                id="email"
                class="form-control"
                placeholder="you@example.com"
                autocomplete="email"
                required
            >

        </div>


        <!-- PASSWORD -->

        <div class="form-group">

            <label for="password">
                Password
            </label>

            <div class="password-box">

                <input
                    type="password"
                    id="password"
                    class="form-control"
                    placeholder="••••••••"
                    autocomplete="current-password"
                    required
                >

                <button
                    type="button"
                    id="passwordToggle"
                    class="password-toggle">
                    SHOW
                </button>

            </div>

        </div>


        <!-- OPTIONS -->

        <div class="options">

            <label class="remember">

                <input
                    type="checkbox"
                    id="rememberMe">

                <span>
                    Remember me
                </span>

            </label>


            <a
                href="#"
                id="forgotPassword"
                class="forgot">
                Forgot password?
            </a>

        </div>


        <!-- LOGIN -->

        <button
            type="submit"
            class="login-btn"
            id="loginButton">

            Log In

        </button>

    </form>


    <!-- REGISTER → PACKAGES -->

    <div class="register-text">

        Don't have an account?

        <a href="index.html#packages">
            Register Now
        </a>

    </div>

</div>

</main>


<!-- ================= FOOTER ================= -->

<footer class="footer">

    <p>
        © 2026 Skills Market. All Rights Reserved.
    </p>

    <div class="footer-links">

        <a href="#">
            Privacy Policy
        </a>

        <span>•</span>

        <a href="#">
            Terms & Conditions
        </a>

        <span>•</span>

        <a href="#">
            Contact Us
        </a>

    </div>

</footer>

</div>


<!-- ================= SUPABASE ================= -->

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
    "https://hmlonjwqeqedakzhucix.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_6HJhKU30iWPoGG5RVuxBPA_VAlQUsYV";

const supabaseClient =
    supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =========================================================
   ELEMENTS
========================================================= */

const loginForm =
    document.getElementById("loginForm");

const emailInput =
    document.getElementById("email");

const passwordInput =
    document.getElementById("password");

const loginButton =
    document.getElementById("loginButton");

const message =
    document.getElementById("message");

const passwordToggle =
    document.getElementById("passwordToggle");

const forgotPassword =
    document.getElementById("forgotPassword");


/* =========================================================
   MESSAGE
========================================================= */

function showMessage(text,type){

    message.textContent = text;

    message.className =
        "message " + type;
}


function clearMessage(){

    message.textContent = "";

    message.className =
        "message";
}


/* =========================================================
   PASSWORD SHOW / HIDE
========================================================= */

passwordToggle.addEventListener(
    "click",
    function(){

        if(passwordInput.type === "password"){

            passwordInput.type = "text";

            passwordToggle.textContent =
                "HIDE";

        }

        else{

            passwordInput.type =
                "password";

            passwordToggle.textContent =
                "SHOW";
        }

    }
);


/* =========================================================
   LOGIN
========================================================= */

loginForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();

        clearMessage();

        const email =
            emailInput.value.trim();

        const password =
            passwordInput.value;


        if(!email || !password){

            showMessage(
                "Please enter your email and password.",
                "error"
            );

            return;
        }


        loginButton.disabled = true;

        loginButton.textContent =
            "Logging in...";


        try{

            const {
                data,
                error
            } =
            await supabaseClient.auth
            .signInWithPassword({

                email:email,
                password:password

            });


            if(error){
                throw error;
            }


            if(!data.session){

                throw new Error(
                    "Login session could not be created."
                );
            }


            showMessage(
                "Login successful! Redirecting...",
                "success"
            );


            setTimeout(
                function(){

                    window.location.href =
                        "dashboard.html";

                },
                800
            );


        }

        catch(error){

            console.error(error);

            let errorMessage =
                "Unable to login. Please try again.";


            if(
                error.message &&
                error.message
                .toLowerCase()
                .includes("invalid login")
            ){

                errorMessage =
                    "Invalid email or password.";

            }


            if(
                error.message &&
                error.message
                .toLowerCase()
                .includes("email not confirmed")
            ){

                errorMessage =
                    "Please confirm your email before logging in.";

            }


            showMessage(
                errorMessage,
                "error"
            );


            loginButton.disabled =
                false;

            loginButton.textContent =
                "Log In";
        }

    }
);


/* =========================================================
   FORGOT PASSWORD
========================================================= */

forgotPassword.addEventListener(
    "click",
    async function(event){

        event.preventDefault();

        clearMessage();

        const email =
            emailInput.value.trim();


        if(!email){

            showMessage(
                "Enter your registered email first.",
                "error"
            );

            emailInput.focus();

            return;
        }


        try{

            const { error } =
                await supabaseClient.auth
                .resetPasswordForEmail(
                    email,
                    {
                        redirectTo:
                        "https://rijalrayeen786786.github.io/skillsmarket/reset-password.html"
                    }
                );


            if(error){
                throw error;
            }


            showMessage(
                "Password reset link has been sent to your email.",
                "success"
            );

        }

        catch(error){

            console.error(error);

            showMessage(
                "Unable to send password reset email.",
                "error"
            );

        }

    }
);

</script>

</body>
</html>
