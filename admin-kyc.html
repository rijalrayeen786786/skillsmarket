<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Skills Market | Admin KYC Approval</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
body{background:#f6f7fb;color:#111827;padding:20px;}
.container{max-width:1000px;margin:0 auto;}
h2{margin-bottom:20px;font-size:24px;}
.kyc-table{width:100%;border-collapse:collapse;background:#fff;border-radius:12px;overflow:hidden;box-shadow:0 4px 15px rgba(15,23,42,.05);}
.kyc-table th, .kyc-table td{padding:12px 16px;text-align:left;border-bottom:1px solid #eef2f7;font-size:13px;}
.kyc-table th{background:#f8fafc;font-weight:800;color:#334155;}
.btn{padding:6px 12px;border:0;border-radius:6px;font-weight:700;cursor:pointer;font-size:12px;margin-right:5px;}
.btn-approve{background:#16a34a;color:#fff;}
.btn-reject{background:#dc2626;color:#fff;}
.status-pending{color:#d97706;font-weight:700;}
.status-approved{color:#16a34a;font-weight:700;}
.status-rejected{color:#dc2626;font-weight:700;}
</style>
</head>
<body>

<div class="container">
    <h2>Admin KYC Requests</h2>
    <div style="overflow-x:auto;">
        <table class="kyc-table">
            <thead>
                <tr>
                    <th>User ID</th>
                    <th>Holder Name</th>
                    <th>Bank & Account</th>
                    <th>IFSC</th>
                    <th>UPI ID</th>
                    <th>Status</th>
                    <th>Action</th>
                </tr>
            </thead>
            <tbody id="kycTableBody">
                <tr><td colspan="7" style="text-align:center;">Loading requests...</td></tr>
            </tbody>
        </table>
    </div>
</div>

<script>
const SUPABASE_URL = "https://hmlonjwqeqedakzhucix.supabase.co";
const SUPABASE_KEY = "sb_publishable_6HJhKU30iWPoGG5RVuxBPA_VAlQUsYV";
const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

async function loadAllKYCRequests(){
    const { data, error } = await supabaseClient
        .from("kyc_submissions")
        .select("*")
        .order("created_at", { ascending: false });

    const tbody = document.getElementById("kycTableBody");
    if(error){
        tbody.innerHTML = `<tr><td colspan="7" style="color:red;text-align:center;">Error loading data: ${error.message}</td></tr>`;
        return;
    }

    if(!data || data.length === 0){
        tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">No KYC requests found.</td></tr>`;
        return;
    }

    tbody.innerHTML = "";
    data.forEach(item => {
        let statusBadge = `<span class="status-${item.status}">${item.status.toUpperCase()}</span>`;
        let actionBtns = `
            <button class="btn btn-approve" onclick="updateStatus('${item.id}', 'approved')">Approve</button>
            <button class="btn btn-reject" onclick="updateStatus('${item.id}', 'rejected')">Reject</button>
        `;

        if(item.status !== 'pending'){
            actionBtns = `<span style="color:#64748b;font-size:12px;">Completed</span>`;
        }

        tbody.innerHTML += `
            <tr>
                <td style="font-size:11px;color:#64748b;">${item.user_id}</td>
                <td><b>${item.holder_name}</b></td>
                <td>${item.bank_name}<br><small>${item.account_number}</small></td>
                <td>${item.ifsc_code}</td>
                <td>${item.upi_id}</td>
                <td>${statusBadge}</td>
                <td>${actionBtns}</td>
            </tr>
        `;
    });
}

async function updateStatus(id, newStatus){
    if(!confirm(`Are you sure you want to mark this KYC as ${newStatus}?`)) return;

    const { error } = await supabaseClient
        .from("kyc_submissions")
        .update({ status: newStatus })
        .eq("id", id);

    if(error){
        alert("Failed to update status: " + error.message);
        return;
    }

    alert(`KYC has been successfully ${newStatus}!`);
    loadAllKYCRequests();
}

loadAllKYCRequests();
</script>

</body>
</html>
