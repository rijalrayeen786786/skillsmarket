<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile | Skills Market</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        .form-input {
            border: 1px solid #e2e8f0;
            border-radius: 0.5rem;
            padding: 0.75rem 1rem;
            width: 100%;
            font-size: 0.9rem;
            color: #334155;
            background-color: #ffffff;
            outline: none;
            transition: all 0.2s ease;
        }

        .form-input:focus {
            border-color: #9333ea;
            box-shadow: 0 0 0 3px rgba(147, 51, 234, 0.15);
        }

        .loading {
            opacity: 0.6;
            pointer-events: none;
        }
    </style>
</head>

<body class="bg-gradient-to-b from-purple-50/40 to-pink-50/20 font-sans antialiased text-slate-800">

    <!-- Main Container -->
    <div class="max-w-3xl mx-auto px-4 py-8">

        <!-- Header -->
        <div class="mb-6">
            <h1 class="text-2xl font-bold text-purple-900">
                My Profile
            </h1>

            <p class="text-sm text-slate-500 mt-1">
                Manage your personal information
            </p>
        </div>

        <!-- Card -->
        <div class="bg-white p-6 md:p-8 rounded-3xl shadow-sm border border-purple-100 space-y-6">

            <!-- ========================= -->
            <!-- SPONSOR INFORMATION -->
            <!-- ========================= -->

            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-bold uppercase tracking-wider py-2.5 px-4 rounded-lg shadow-sm">
                Sponsor Information
            </div>

            <div class="space-y-4">

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        Name
                    </label>

                    <input
                        id="sponsorName"
                        type="text"
                        value="Loading..."
                        readonly
                        class="form-input bg-slate-50/50"
                    >
                </div>

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        Phone
                    </label>

                    <input
                        id="sponsorPhone"
                        type="text"
                        value="Loading..."
                        readonly
                        class="form-input bg-slate-50/50"
                    >
                </div>

            </div>


            <!-- ========================= -->
            <!-- PERSONAL INFORMATION -->
            <!-- ========================= -->

            <div class="bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-xs font-bold uppercase tracking-wider py-2.5 px-4 rounded-lg shadow-sm mt-8">
                Personal Information
            </div>

            <form id="profileForm" class="space-y-4">

                <!-- Name -->

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        Name <span class="text-red-500">*</span>
                    </label>

                    <input
                        id="fullName"
                        type="text"
                        class="form-input"
                        required
                    >
                </div>


                <!-- Email -->

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        Email <span class="text-red-500">*</span>
                    </label>

                    <input
                        id="email"
                        type="email"
                        class="form-input bg-slate-50/50"
                        readonly
                    >
                </div>


                <!-- Phone -->

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        Phone <span class="text-red-500">*</span>
                    </label>

                    <input
                        id="phone"
                        type="text"
                        class="form-input"
                        required
                    >
                </div>


                <!-- Gender -->

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        Gender <span class="text-red-500">*</span>
                    </label>

                    <div class="flex gap-6 pt-1">

                        <label class="flex items-center gap-2 cursor-pointer">

                            <input
                                id="genderMale"
                                type="radio"
                                name="gender"
                                value="Male"
                                class="text-purple-600 focus:ring-purple-500 h-4 w-4"
                            >

                            <span class="text-sm">
                                Male
                            </span>

                        </label>


                        <label class="flex items-center gap-2 cursor-pointer">

                            <input
                                id="genderFemale"
                                type="radio"
                                name="gender"
                                value="Female"
                                class="text-purple-600 focus:ring-purple-500 h-4 w-4"
                            >

                            <span class="text-sm">
                                Female
                            </span>

                        </label>

                    </div>
                </div>


                <!-- Address -->

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        Address <span class="text-red-500">*</span>
                    </label>

                    <input
                        id="address"
                        type="text"
                        class="form-input"
                    >
                </div>


                <!-- City -->

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        City <span class="text-red-500">*</span>
                    </label>

                    <input
                        id="city"
                        type="text"
                        class="form-input"
                    >
                </div>


                <!-- State -->

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        State <span class="text-red-500">*</span>
                    </label>

                    <div class="relative">

                        <select
                            id="state"
                            class="form-input appearance-none bg-white"
                        >

                            <option value="">
                                Select State
                            </option>

                            <option value="Madhya Pradesh">
                                Madhya Pradesh
                            </option>

                            <option value="Uttar Pradesh">
                                Uttar Pradesh
                            </option>

                            <option value="Bihar">
                                Bihar
                            </option>

                            <option value="Delhi">
                                Delhi
                            </option>

                            <option value="Rajasthan">
                                Rajasthan
                            </option>

                            <option value="Maharashtra">
                                Maharashtra
                            </option>

                            <option value="Gujarat">
                                Gujarat
                            </option>

                            <option value="Haryana">
                                Haryana
                            </option>

                            <option value="Punjab">
                                Punjab
                            </option>

                            <option value="West Bengal">
                                West Bengal
                            </option>

                        </select>

                        <span class="absolute inset-y-0 right-0 flex items-center pr-3 pointer-events-none text-purple-600">
                            ⌄
                        </span>

                    </div>
                </div>


                <!-- Pincode -->

                <div>
                    <label class="block text-sm text-slate-700 mb-1.5">
                        Pincode <span class="text-red-500">*</span>
                    </label>

                    <input
                        id="pincode"
                        type="text"
                        inputmode="numeric"
                        maxlength="6"
                        class="form-input"
                    >
                </div>


                <!-- Avatar -->

                <div>

                    <label class="block text-sm text-slate-700 mb-1.5">
                        Avatar
                    </label>

                    <div class="flex flex-col sm:flex-row items-start sm:items-center gap-4">

                        <input
                            id="avatarInput"
                            type="file"
                            accept="image/*"
                            class="block w-full text-sm text-slate-500 file:mr-4 file:py-2.5 file:px-4 file:rounded-lg file:border-0 file:text-sm file:font-semibold file:bg-slate-100 file:text-slate-700 hover:file:bg-slate-200 border border-slate-200 rounded-lg p-1"
                        >

                    </div>


                    <div class="mt-3 w-20 h-20 border border-slate-200 rounded-lg p-1 bg-slate-50 flex items-center justify-center">

                        <img
                            id="avatarPreview"
                            src=""
                            alt="Avatar Preview"
                            class="max-h-full max-w-full object-contain rounded hidden"
                        >

                        <div
                            id="avatarLetter"
                            class="w-full h-full rounded flex items-center justify-center bg-gradient-to-r from-purple-600 to-indigo-600 text-white text-2xl font-bold"
                        >
                            M
                        </div>

                    </div>

                </div>


                <!-- Save -->

                <div class="pt-4">

                    <button
                        id="saveButton"
                        type="submit"
                        class="bg-gradient-to-r from-pink-500 to-purple-600 text-white font-medium px-8 py-3 rounded-full shadow-md hover:opacity-90 transition-all text-sm"
                    >
                        Save Changes
                    </button>

                </div>

            </form>

        </div>


        <!-- Footer -->

        <div class="text-center mt-8 text-xs text-slate-400">
            © 2026 Skills Market. All rights reserved.
        </div>

    </div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
    "https://hmlonjwqeqedakzhucix.supabase.co";

const SUPABASE_KEY =
    "sb_publishable_6HJhKU30iWPoGG5RVuxBPA_VAlQUsYV";

const supabaseClient =
    window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


/* =====================================================
   ELEMENTS
===================================================== */

const fullNameInput =
    document.getElementById("fullName");

const emailInput =
    document.getElementById("email");

const phoneInput =
    document.getElementById("phone");

const addressInput =
    document.getElementById("address");

const cityInput =
    document.getElementById("city");

const stateInput =
    document.getElementById("state");

const pincodeInput =
    document.getElementById("pincode");

const sponsorNameInput =
    document.getElementById("sponsorName");

const sponsorPhoneInput =
    document.getElementById("sponsorPhone");

const genderMale =
    document.getElementById("genderMale");

const genderFemale =
    document.getElementById("genderFemale");

const avatarInput =
    document.getElementById("avatarInput");

const avatarPreview =
    document.getElementById("avatarPreview");

const avatarLetter =
    document.getElementById("avatarLetter");

const profileForm =
    document.getElementById("profileForm");

const saveButton =
    document.getElementById("saveButton");


/* =====================================================
   LOAD PROFILE
===================================================== */

async function loadProfile(){

    try{

        const {
            data:{user},
            error:authError
        } =
        await supabaseClient.auth.getUser();


        /* No login */

        if(authError || !user){

            window.location.href =
                "login.html";

            return;
        }


        console.log("Logged in user:", user);


        /* =========================================
           GET PROFILE
        ========================================= */

        const {
            data:profile,
            error:profileError
        } =
        await supabaseClient
            .from("profiles")
            .select("*")
            .eq("id",user.id)
            .maybeSingle();


        if(profileError){

            console.error(
                "Profile error:",
                profileError
            );

            alert(
                "Unable to load profile."
            );

            return;
        }


        if(!profile){

            alert(
                "Profile record not found."
            );

            return;
        }


        /* =========================================
           PERSONAL DATA
        ========================================= */

        const metadata =
            user.user_metadata || {};


        const name =
            profile.full_name ||
            metadata.full_name ||
            "";


        const phone =
            profile.phone ||
            "";


        fullNameInput.value =
            name;


        emailInput.value =
            user.email || "";


        phoneInput.value =
            phone;


        /* =========================================
           EXTRA PERSONAL DATA
           Stored in Supabase Auth metadata
        ========================================= */

        addressInput.value =
            metadata.address || "";


        cityInput.value =
            metadata.city || "";


        stateInput.value =
            metadata.state || "";


        pincodeInput.value =
            metadata.pincode || "";


        const gender =
            metadata.gender || "";


        if(gender === "Male"){

            genderMale.checked = true;

        }


        if(gender === "Female"){

            genderFemale.checked = true;

        }


        /* =========================================
           AVATAR
        ========================================= */

        const avatar =
            metadata.avatar_url || "";


        if(avatar){

            avatarPreview.src =
                avatar;

            avatarPreview.classList.remove(
                "hidden"
            );

            avatarLetter.classList.add(
                "hidden"
            );

        }else{

            setAvatarLetter(name);

        }


        /* =========================================
           SPONSOR
        ========================================= */

        sponsorNameInput.value =
            "Not Available";

        sponsorPhoneInput.value =
            "Not Available";


        if(profile.referrer_member_id){

            const {
                data:sponsor,
                error:sponsorError
            } =
            await supabaseClient
                .from("profiles")
                .select(
                    "full_name, phone, member_id"
                )
                .eq(
                    "member_id",
                    profile.referrer_member_id
                )
                .maybeSingle();


            if(
                !sponsorError &&
                sponsor
            ){

                sponsorNameInput.value =
                    sponsor.full_name ||
                    "Not Available";

                sponsorPhoneInput.value =
                    sponsor.phone ||
                    "Not Available";

            }

        }

    }catch(error){

        console.error(
            "Profile loading error:",
            error
        );

    }

}


/* =====================================================
   AVATAR LETTER
===================================================== */

function setAvatarLetter(name){

    if(!name){

        avatarLetter.textContent =
            "M";

        return;
    }


    avatarLetter.textContent =
        name
            .trim()
            .charAt(0)
            .toUpperCase();

}


/* =====================================================
   AVATAR PREVIEW
===================================================== */

avatarInput.addEventListener(
    "change",
    function(){

        const file =
            this.files[0];

        if(!file){

            return;
        }


        const reader =
            new FileReader();


        reader.onload =
            function(event){

                avatarPreview.src =
                    event.target.result;

                avatarPreview.classList.remove(
                    "hidden"
                );

                avatarLetter.classList.add(
                    "hidden"
                );

            };


        reader.readAsDataURL(file);

    }
);


/* =====================================================
   SAVE PROFILE
===================================================== */

profileForm.addEventListener(
    "submit",
    async function(event){

        event.preventDefault();


        saveButton.disabled =
            true;

        saveButton.textContent =
            "Saving...";


        try{

            const {
                data:{user},
                error:authError
            } =
            await supabaseClient.auth.getUser();


            if(authError || !user){

                window.location.href =
                    "login.html";

                return;
            }


            /* =====================================
               GENDER
            ===================================== */

            let gender = "";


            if(genderMale.checked){

                gender = "Male";

            }else if(genderFemale.checked){

                gender = "Female";

            }


            /* =====================================
               UPDATE PROFILE TABLE
            ===================================== */

            const {
                error:profileUpdateError
            } =
            await supabaseClient
                .from("profiles")
                .update({

                    full_name:
                        fullNameInput.value.trim(),

                    phone:
                        phoneInput.value.trim()

                })
                .eq(
                    "id",
                    user.id
                );


            if(profileUpdateError){

                console.error(
                    profileUpdateError
                );

                throw profileUpdateError;
            }


            /* =====================================
               UPDATE AUTH METADATA
            ===================================== */

            const currentMetadata =
                user.user_metadata || {};


            const avatarFile =
                avatarInput.files[0];


            let avatarUrl =
                currentMetadata.avatar_url ||
                "";


            /*
              Avatar file preview works immediately.
              Permanent Storage upload will be added
              after the Skills Market storage bucket
              is configured.
            */


            const {
                error:metadataError
            } =
            await supabaseClient.auth.updateUser({

                data:{

                    full_name:
                        fullNameInput.value.trim(),

                    gender:
                        gender,

                    address:
                        addressInput.value.trim(),

                    city:
                        cityInput.value.trim(),

                    state:
                        stateInput.value,

                    pincode:
                        pincodeInput.value.trim(),

                    avatar_url:
                        avatarUrl

                }

            });


            if(metadataError){

                console.error(
                    metadataError
                );

                throw metadataError;
            }


            /* =====================================
               SUCCESS
            ===================================== */

            saveButton.textContent =
                "Saved ✓";


            setTimeout(
                function(){

                    saveButton.textContent =
                        "Save Changes";

                    saveButton.disabled =
                        false;

                },
                1500
            );


        }catch(error){

            console.error(
                "Save error:",
                error
            );


            alert(
                "Profile update failed. Please try again."
            );


            saveButton.textContent =
                "Save Changes";

            saveButton.disabled =
                false;

        }

    }
);


/* =====================================================
   START
===================================================== */

loadProfile();

</script>

</body>
</html>
